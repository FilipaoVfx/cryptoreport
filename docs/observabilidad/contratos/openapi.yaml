openapi: 3.1.1
info:
  title: API del panel de administración y observabilidad de Urania/Diario
  version: 1.0.0
  summary: Salud, ejecuciones, trazas, parámetros versionados, Biblioteca, feedback, intervenciones y auditoría.
  description: |
    API del servicio independiente `cr-panel`. Lee el estado operativo en solo lectura (state.sqlite,
    bridge/state.sqlite, pipeline-status.json), consulta la telemetría (Jaeger API v3, VictoriaMetrics,
    VictoriaLogs) y escribe únicamente en su propia base (panel.sqlite) y en los archivos de control
    declarados en el catálogo de intervenciones.

    Reglas de contrato que comprueba `herramientas/validate_contracts.py`:
    - `x-cr-min-role`: rol mínimo (viewer < reviewer < operator < admin; auditor solo amplía viewer con auditoría).
    - `x-cr-audit`: acción registrada en la cadena de auditoría; obligatoria en toda operación que cambia estado.
    - Las operaciones que cambian estado exigen las cabeceras `Idempotency-Key` y `X-CSRF-Token`,
      salvo las marcadas con `x-cr-read-only: true`.
    - `x-cr-phase`: fase de la hoja de ruta en que la operación queda disponible.
    - Errores en `application/problem+json` (RFC 9457).
servers:
  - url: https://panel.2-25-233-186.sslip.io/api/v1
    description: Producción propuesta (vhost propio con TLS de Let's Encrypt)
  - url: http://127.0.0.1:8750/api/v1
    description: Proceso local detrás de nginx (solo loopback)
security:
  - session: []
tags:
  - name: salud
    description: Estado agregado, alertas, umbrales y series de métricas.
  - name: ejecuciones
    description: Libro de ejecuciones, spans y logs por run_id.
  - name: trabajos
    description: Cola del puente y su historial de transiciones.
  - name: agentes
    description: Agentes registrados y su rendimiento.
  - name: evaluaciones
    description: Validador, trayectorias, autorater y evaluación humana.
  - name: feedback
    description: Valoraciones 👍/👎 versionadas.
  - name: intervenciones
    description: Catálogo y ciclo de vida de las intervenciones manuales.
  - name: configuracion
    description: Parámetros, versiones de configuración y solicitudes de cambio.
  - name: herramientas
    description: Registro de herramientas, enrutamiento y guardas.
  - name: biblioteca
    description: Activos, versiones, calidad, búsqueda e índices vectoriales.
  - name: auditoria
    description: Cadena de auditoría y su verificación.
  - name: sesion
    description: Inicio y cierre de sesión, cuenta actual y usuarios.
  - name: eventos
    description: Flujo de eventos en tiempo real (SSE).
paths:
  /health:
    get:
      tags: [salud]
      operationId: getHealth
      summary: Informe de salud agregado de la portada.
      x-cr-min-role: viewer
      x-cr-phase: 2
      responses:
        '200':
          description: Informe vigente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthReport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /pipeline-status:
    get:
      tags: [salud]
      operationId: getPipelineStatus
      summary: pipeline-status.json tal cual lo escribe el puente (contrato v1).
      x-cr-min-role: viewer
      x-cr-phase: 2
      responses:
        '200':
          description: Último informe del puente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PipelineStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /thresholds:
    get:
      tags: [salud]
      operationId: getThresholds
      summary: Registro de umbrales vigente.
      x-cr-min-role: viewer
      x-cr-phase: 2
      responses:
        '200':
          description: Umbrales.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Thresholds'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /alerts:
    get:
      tags: [salud]
      operationId: listAlerts
      summary: Alertas por estado y severidad.
      x-cr-min-role: viewer
      x-cr-phase: 2
      parameters:
        - name: state
          in: query
          schema: {enum: [firing, acknowledged, resolved, silenced]}
        - name: severity
          in: query
          schema: {enum: [warning, critical]}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Página de alertas.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /alerts/{alert_id}/acknowledge:
    post:
      tags: [salud]
      operationId: acknowledgeAlert
      summary: Reconocer una alerta (no la resuelve).
      x-cr-min-role: operator
      x-cr-audit: alert.acknowledge
      x-cr-phase: 2
      parameters:
        - {$ref: '#/components/parameters/AlertId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: {type: string, maxLength: 500}
      responses:
        '200':
          description: Alerta reconocida.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Alert'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /alerts/{alert_id}/silence:
    post:
      tags: [salud]
      operationId: silenceAlert
      summary: Silenciar una alerta hasta una fecha, con motivo.
      x-cr-min-role: operator
      x-cr-audit: alert.silence
      x-cr-phase: 2
      parameters:
        - {$ref: '#/components/parameters/AlertId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SilenceInput'}
      responses:
        '200':
          description: Alerta silenciada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Alert'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /metrics/{metric_name}/series:
    get:
      tags: [salud]
      operationId: getMetricSeries
      summary: Serie temporal de una métrica del registro de nombres.
      description: El nombre debe existir en registros/semconv.json; el panel consulta VictoriaMetrics con el selector {__name__="..."}.
      x-cr-min-role: viewer
      x-cr-phase: 2
      parameters:
        - name: metric_name
          in: path
          required: true
          schema: {type: string, pattern: '^(cr|gen_ai)(\.[a-z0-9_]+)+$'}
        - name: from
          in: query
          required: true
          schema: {$ref: './esquemas/common.schema.json#/$defs/Timestamp'}
        - name: to
          in: query
          required: true
          schema: {$ref: './esquemas/common.schema.json#/$defs/Timestamp'}
        - name: step
          in: query
          schema: {type: integer, minimum: 60, maximum: 86400, default: 900}
        - name: aggregation
          in: query
          schema: {enum: [sum, rate, p50, p90, p95, max, last]}
        - name: group_by
          in: query
          schema: {type: array, items: {type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z0-9_]+)+$'}, maxItems: 3}
      responses:
        '200':
          description: Serie.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MetricSeries'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs:
    get:
      tags: [ejecuciones]
      operationId: listRuns
      summary: Libro de ejecuciones.
      x-cr-min-role: viewer
      x-cr-phase: 2
      parameters:
        - name: service
          in: query
          schema: {$ref: './esquemas/common.schema.json#/$defs/ServiceName'}
        - name: outcome
          in: query
          schema: {enum: [running, ok, degraded, failed, busy, skipped]}
        - name: since
          in: query
          schema: {$ref: './esquemas/common.schema.json#/$defs/Timestamp'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Página de ejecuciones, de la más reciente a la más antigua.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /runs/{run_id}:
    get:
      tags: [ejecuciones]
      operationId: getRun
      summary: Una ejecución.
      x-cr-min-role: viewer
      x-cr-phase: 2
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200':
          description: Ejecución.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunRecord'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{run_id}/spans:
    get:
      tags: [ejecuciones]
      operationId: getRunSpans
      summary: Spans de la traza de la ejecución (Jaeger API v3 normalizada).
      x-cr-min-role: viewer
      x-cr-phase: 2
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200':
          description: Spans ordenados por start_time.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpanList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /runs/{run_id}/logs:
    get:
      tags: [ejecuciones]
      operationId: getRunLogs
      summary: Logs estructurados de la ejecución (VictoriaLogs por cr.run.id).
      x-cr-min-role: viewer
      x-cr-phase: 2
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - name: severity
          in: query
          schema: {enum: [DEBUG, INFO, WARN, ERROR, FATAL]}
      responses:
        '200':
          description: Líneas de log.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /jobs:
    get:
      tags: [trabajos]
      operationId: listJobs
      summary: Trabajos del puente.
      x-cr-min-role: viewer
      x-cr-phase: 2
      parameters:
        - name: state
          in: query
          schema: {$ref: './esquemas/job.schema.json#/$defs/JobState'}
        - name: channel
          in: query
          schema: {$ref: './esquemas/common.schema.json#/$defs/ChannelSlug'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Página de trabajos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /jobs/{job_id}:
    get:
      tags: [trabajos]
      operationId: getJob
      summary: Un trabajo con su historial de transiciones.
      x-cr-min-role: viewer
      x-cr-phase: 2
      parameters:
        - {$ref: '#/components/parameters/JobId'}
      responses:
        '200':
          description: Trabajo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /agents:
    get:
      tags: [agentes]
      operationId: listAgents
      summary: Agentes registrados con su rendimiento de 7 días.
      x-cr-min-role: viewer
      x-cr-phase: 2
      responses:
        '200':
          description: Agentes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /agents/{tool_id}/runs:
    get:
      tags: [agentes]
      operationId: listAgentRuns
      summary: Ejecuciones de un agente (reconstruidas desde sus comprobantes).
      x-cr-min-role: viewer
      x-cr-phase: 2
      parameters:
        - {$ref: '#/components/parameters/ToolId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Página de ejecuciones del agente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /evaluations:
    get:
      tags: [evaluaciones]
      operationId: listEvaluations
      summary: Resultados de evaluación.
      x-cr-min-role: viewer
      x-cr-phase: 2
      parameters:
        - name: name
          in: query
          schema: {$ref: './esquemas/evaluation-result.schema.json#/$defs/EvaluationName'}
        - name: kind
          in: query
          schema: {enum: [validator, trajectory, autorater, human, search, tagging]}
        - name: target_id
          in: query
          schema: {type: string, maxLength: 200}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Página de evaluaciones.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluationPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /evaluations/{evaluation_id}:
    get:
      tags: [evaluaciones]
      operationId: getEvaluation
      summary: Una evaluación.
      x-cr-min-role: viewer
      x-cr-phase: 2
      parameters:
        - name: evaluation_id
          in: path
          required: true
          schema: {$ref: './esquemas/common.schema.json#/$defs/Uuid'}
      responses:
        '200':
          description: Evaluación.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluationResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /feedback:
    get:
      tags: [feedback]
      operationId: listFeedback
      summary: Valoraciones por objeto, signo y fecha.
      x-cr-min-role: viewer
      x-cr-phase: 2
      parameters:
        - name: target_id
          in: query
          schema: {type: string, maxLength: 200}
        - name: rating
          in: query
          schema: {enum: [up, down]}
        - name: since
          in: query
          schema: {$ref: './esquemas/common.schema.json#/$defs/Timestamp'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Página de feedback.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeedbackPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [feedback]
      operationId: createFeedback
      summary: Registrar un 👍 o 👎 sobre una versión concreta.
      description: Un 👎 con severidad blocking crea además una intervención quarantine_asset en estado requested.
      x-cr-min-role: reviewer
      x-cr-audit: feedback.create
      x-cr-phase: 2
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeedbackInput'}
      responses:
        '201':
          description: Feedback creado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Feedback'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /intervention-types:
    get:
      tags: [intervenciones]
      operationId: listInterventionTypes
      summary: Catálogo de intervenciones disponibles para el rol actual.
      x-cr-min-role: viewer
      x-cr-phase: 2
      responses:
        '200':
          description: Catálogo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterventionCatalog'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /interventions:
    get:
      tags: [intervenciones]
      operationId: listInterventions
      summary: Intervenciones por estado y tipo.
      x-cr-min-role: viewer
      x-cr-phase: 2
      parameters:
        - name: state
          in: query
          schema: {enum: [requested, pending_approval, approved, executing, succeeded, failed, rejected, cancelled, reverted]}
        - name: type
          in: query
          schema: {type: string, pattern: '^[a-z][a-z0-9_]+$'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Página de intervenciones.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterventionPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [intervenciones]
      operationId: requestIntervention
      summary: Solicitar una intervención (con dry_run para ver precondiciones, efecto y coste).
      description: El rol efectivo es el min_role del tipo en el catálogo; si exige segunda persona queda en pending_approval.
      x-cr-min-role: reviewer
      x-cr-audit: intervention.request
      x-cr-phase: 2
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InterventionInput'}
      responses:
        '202':
          description: Intervención aceptada (o vista previa si dry_run).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Intervention'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /interventions/{intervention_id}:
    get:
      tags: [intervenciones]
      operationId: getIntervention
      summary: Una intervención.
      x-cr-min-role: viewer
      x-cr-phase: 2
      parameters:
        - {$ref: '#/components/parameters/InterventionId'}
      responses:
        '200':
          description: Intervención.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Intervention'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /interventions/{intervention_id}/approve:
    post:
      tags: [intervenciones]
      operationId: approveIntervention
      summary: Aprobar como segunda persona (nunca quien la solicitó).
      x-cr-min-role: reviewer
      x-cr-audit: intervention.approve
      x-cr-phase: 2
      parameters:
        - {$ref: '#/components/parameters/InterventionId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecisionInput'}
      responses:
        '200':
          description: Intervención aprobada; se ejecuta en segundo plano.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Intervention'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /interventions/{intervention_id}/reject:
    post:
      tags: [intervenciones]
      operationId: rejectIntervention
      summary: Rechazar una intervención pendiente.
      x-cr-min-role: reviewer
      x-cr-audit: intervention.reject
      x-cr-phase: 2
      parameters:
        - {$ref: '#/components/parameters/InterventionId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecisionInput'}
      responses:
        '200':
          description: Intervención rechazada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Intervention'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /interventions/{intervention_id}/cancel:
    post:
      tags: [intervenciones]
      operationId: cancelIntervention
      summary: Cancelar una intervención aún no ejecutada.
      x-cr-min-role: reviewer
      x-cr-audit: intervention.cancel
      x-cr-phase: 2
      parameters:
        - {$ref: '#/components/parameters/InterventionId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '200':
          description: Intervención cancelada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Intervention'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /interventions/{intervention_id}/revert:
    post:
      tags: [intervenciones]
      operationId: revertIntervention
      summary: Deshacer una intervención reversible con su tipo undo.
      x-cr-min-role: operator
      x-cr-audit: intervention.revert
      x-cr-phase: 2
      parameters:
        - {$ref: '#/components/parameters/InterventionId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecisionInput'}
      responses:
        '202':
          description: Intervención de deshacer creada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Intervention'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /parameters:
