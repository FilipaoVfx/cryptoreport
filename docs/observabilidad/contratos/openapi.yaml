      summary: Crear una cuenta (el alta de TOTP se completa en el primer acceso).
      x-cr-min-role: admin
      x-cr-audit: user.create
      x-cr-phase: 2
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserInput'}
      responses:
        '201':
          description: Cuenta creada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /users/{user_id}:
    patch:
      tags: [sesion]
      operationId: updateUser
      summary: Cambiar roles o desactivar una cuenta (nunca la propia).
      x-cr-min-role: admin
      x-cr-audit: user.role_change
      x-cr-phase: 2
      parameters:
        - name: user_id
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserPatch'}
      responses:
        '200':
          description: Cuenta actualizada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /events/stream:
    get:
      tags: [eventos]
      operationId: streamEvents
      summary: Eventos en tiempo real (Server-Sent Events) con reanudación por Last-Event-ID.
      description: Cada evento lleva en data un StreamEvent en JSON; se emite heartbeat cada 25 s.
      x-cr-min-role: viewer
      x-cr-phase: 2
      x-cr-event-schema: {$ref: './esquemas/common.schema.json#/$defs/StreamEvent'}
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {type: string, maxLength: 64}
      responses:
        '200':
          description: Flujo text/event-stream.
          content:
            text/event-stream:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: crpanel_session
      description: Sesión de persona (HttpOnly, Secure, SameSite=Strict, caducidad deslizante de 8 h y absoluta de 24 h).
    serviceToken:
      type: http
      scheme: bearer
      description: Token de servicio de solo lectura (rol viewer) para el tablero de pared y scripts; nunca para mutaciones.
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 512}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 50}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave única por intención; repetir la petición con la misma clave devuelve el mismo resultado.
      schema: {type: string, minLength: 8, maxLength: 128}
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token anti-CSRF ligado a la sesión (patrón synchronizer token).
      schema: {type: string, minLength: 16, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag de la versión de configuración activa sobre la que se trabaja.
      schema: {type: string, pattern: '^"v[0-9]+"$'}
    AlertId:
      name: alert_id
      in: path
      required: true
      schema: {$ref: './esquemas/common.schema.json#/$defs/Uuid'}
    RunId:
      name: run_id
      in: path
      required: true
      schema: {$ref: './esquemas/common.schema.json#/$defs/RunId'}
    JobId:
      name: job_id
      in: path
      required: true
      schema: {$ref: './esquemas/common.schema.json#/$defs/JobId'}
    ToolId:
      name: tool_id
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z][a-z0-9_]{1,40}$'}
    InterventionId:
      name: intervention_id
      in: path
      required: true
      schema: {$ref: './esquemas/common.schema.json#/$defs/Uuid'}
    ChangeId:
      name: change_id
      in: path
      required: true
      schema: {$ref: './esquemas/common.schema.json#/$defs/Uuid'}
    ConfigVersionNumber:
      name: version
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    PromptName:
      name: prompt_name
      in: path
      required: true
      schema: {enum: [narrative-analysis, scheduled-instructions, autorater]}
    AssetId:
      name: asset_id
      in: path
      required: true
      schema: {$ref: './esquemas/common.schema.json#/$defs/AssetId'}
    Version:
      name: version
      in: path
      required: true
      schema: {$ref: './esquemas/common.schema.json#/$defs/Sha256'}
  responses:
    BadRequest:
      description: Petición mal formada.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Sin sesión válida.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Rol insuficiente o CSRF inválido.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: No existe.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Transición de estado no permitida, autoaprobación o clave de idempotencia reutilizada con otro cuerpo.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionFailed:
      description: If-Match no coincide con la versión activa.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionRequired:
      description: Falta If-Match.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unprocessable:
      description: El cuerpo no cumple el contrato o una guarda lo bloquea.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooManyRequests:
      description: Límite de peticiones superado.
      headers:
        Retry-After:
          description: Segundos hasta poder reintentar.
          schema: {type: integer, minimum: 1}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unavailable:
      description: El backend de telemetría no responde; el panel sigue sirviendo el libro de ejecuciones.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem: {$ref: './esquemas/common.schema.json#/$defs/Problem'}
    User: {$ref: './esquemas/common.schema.json#/$defs/User'}
    HealthReport: {$ref: './esquemas/health-report.schema.json'}
    PipelineStatus: {$ref: './esquemas/pipeline-status.schema.json'}
    Thresholds: {$ref: './esquemas/thresholds.schema.json'}
    Alert: {$ref: './esquemas/alert.schema.json'}
    RunRecord: {$ref: './esquemas/run-record.schema.json'}
    SpanRecord: {$ref: './esquemas/span-record.schema.json'}
    LogRecord: {$ref: './esquemas/log-record.schema.json'}
    Job: {$ref: './esquemas/job.schema.json'}
    EvaluationResult: {$ref: './esquemas/evaluation-result.schema.json'}
    Feedback: {$ref: './esquemas/feedback.schema.json'}
    Intervention: {$ref: './esquemas/intervention.schema.json'}
    InterventionCatalog: {$ref: './esquemas/intervention-catalog.schema.json'}
    ParameterCatalog: {$ref: './esquemas/parameter-catalog.schema.json'}
    ConfigVersion: {$ref: './esquemas/config-version.schema.json'}
    ConfigChange: {$ref: './esquemas/config-change.schema.json'}
    ToolRegistry: {$ref: './esquemas/tool-registry.schema.json'}
    RoutingPolicy: {$ref: './esquemas/routing-policy.schema.json'}
    GuardrailPolicy: {$ref: './esquemas/guardrail-policy.schema.json'}
    Asset: {$ref: './esquemas/asset.schema.json'}
    QualityReport: {$ref: './esquemas/quality-report.schema.json'}
    VectorIndexStatus: {$ref: './esquemas/vector-index-status.schema.json'}
    SearchRequest: {$ref: './esquemas/search.schema.json#/$defs/SearchRequest'}
    SearchResponse: {$ref: './esquemas/search.schema.json#/$defs/SearchResponse'}
    AuditEvent: {$ref: './esquemas/audit-event.schema.json'}
    MetricSeries:
      type: object
      required: [metric, unit, aggregation, points]
      additionalProperties: false
      properties:
        metric: {type: string}
        unit: {type: string}
        aggregation: {enum: [sum, rate, p50, p90, p95, max, last]}
        points:
          type: array
          items:
            type: object
            required: [t, v]
            additionalProperties: false
            properties:
              t: {$ref: './esquemas/common.schema.json#/$defs/Timestamp'}
              v: {type: [number, 'null']}
              labels: {type: object, additionalProperties: {type: string}}
    SpanList:
      type: object
      required: [trace_id, spans]
      additionalProperties: false
      properties:
        trace_id: {$ref: './esquemas/common.schema.json#/$defs/TraceId'}
        spans: {type: array, items: {$ref: '#/components/schemas/SpanRecord'}}
        source: {enum: [jaeger, ledger_only]}
    LogList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/LogRecord'}}
    AgentList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [tool_id, title, lifecycle, model_verified, runs_7d, runs_error_7d]
            additionalProperties: false
            properties:
              tool_id: {type: string}
              title: {type: string}
              lifecycle: {enum: [proposed, sandbox, shadow, active, degraded_known, disabled, retired]}
              model_verified: {type: boolean}
              gcr_7d: {type: ['number', 'null'], minimum: 0, maximum: 1}
              first_pass_gcr_7d: {type: ['number', 'null'], minimum: 0, maximum: 1}
              runs_7d: {type: integer, minimum: 0}
              runs_error_7d: {type: integer, minimum: 0}
              last_run_at: {$ref: './esquemas/common.schema.json#/$defs/Timestamp'}
    FeedbackInput:
      type: object
      required: [target, rating, surface]
      additionalProperties: false
      properties:
        target: {$ref: './esquemas/common.schema.json#/$defs/TargetRef'}
        rating: {enum: [up, down]}
        reasons:
          type: array
          uniqueItems: true
          items: {enum: [cita_incorrecta, afirmacion_inventada, omision_relevante, tono_erroneo, verificacion_incorrecta, mencion_ambigua, escenario_debil, transcripcion_erronea, otro]}
        severity: {enum: [minor, major, blocking]}
        comment: {type: string, maxLength: 1000}
        retracts: {$ref: './esquemas/common.schema.json#/$defs/Uuid'}
        surface: {enum: [panel, urania, site]}
    InterventionInput:
      type: object
      required: [type, target, reason, dry_run]
      additionalProperties: false
      properties:
        type: {type: string, pattern: '^[a-z][a-z0-9_]+$'}
        target: {$ref: './esquemas/common.schema.json#/$defs/TargetRef'}
        reason: {type: string, minLength: 10, maxLength: 500}
        parameters: {type: object, additionalProperties: {type: [string, integer, boolean]}}
        dry_run: {type: boolean}
    DecisionInput:
      type: object
      additionalProperties: false
      properties:
        comment: {type: string, minLength: 3, maxLength: 500}
    SilenceInput:
      type: object
      required: [until, reason]
      additionalProperties: false
      properties:
        until: {$ref: './esquemas/common.schema.json#/$defs/Timestamp'}
        reason: {type: string, minLength: 10, maxLength: 300}
    ConfigChangeInput:
      type: object
      required: [changes, reason]
      additionalProperties: false
      properties:
        changes:
          type: array
          minItems: 1
          items:
            type: object
            required: [key, to]
            additionalProperties: false
            properties:
              key: {$ref: './esquemas/parameter-catalog.schema.json#/$defs/ParameterKey'}
              to: {}
        reason: {type: string, minLength: 10, maxLength: 1000}
    PromptList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [name, active_version, versions]
            additionalProperties: false
            properties:
              name: {enum: [narrative-analysis, scheduled-instructions, autorater]}
              active_version: {$ref: './esquemas/common.schema.json#/$defs/Sha256'}
              versions:
                type: array
                items:
                  type: object
                  required: [version, created_at, source, eval_gate]
                  additionalProperties: false
                  properties:
                    version: {$ref: './esquemas/common.schema.json#/$defs/Sha256'}
                    semver: {$ref: './esquemas/common.schema.json#/$defs/SemVer'}
                    created_at: {$ref: './esquemas/common.schema.json#/$defs/Timestamp'}
                    source: {enum: [repo, panel]}
                    eval_gate: {enum: [pending, passed, failed, not_required]}
    PromptVersionInput:
      type: object
      required: [text, semver, base_version, notes]
      additionalProperties: false
      properties:
        text: {type: string, minLength: 100, maxLength: 200000}
        semver: {$ref: './esquemas/common.schema.json#/$defs/SemVer'}
        base_version: {$ref: './esquemas/common.schema.json#/$defs/Sha256'}
        notes: {type: string, minLength: 10, maxLength: 2000}
    PromptVersion:
      type: object
      required: [name, version, semver, created_at, created_by, source, eval_gate]
      additionalProperties: false
      properties:
        name: {enum: [narrative-analysis, scheduled-instructions, autorater]}
        version: {$ref: './esquemas/common.schema.json#/$defs/Sha256'}
        semver: {$ref: './esquemas/common.schema.json#/$defs/SemVer'}
        created_at: {$ref: './esquemas/common.schema.json#/$defs/Timestamp'}
        created_by: {$ref: './esquemas/common.schema.json#/$defs/Actor'}
        source: {enum: [repo, panel]}
        eval_gate: {enum: [pending, passed, failed, not_required]}
        text: {type: string}
    ToolDetail:
      type: object
      required: [tool, health]
      additionalProperties: false
      properties:
        tool: {$ref: './esquemas/tool-registry.schema.json#/$defs/Tool'}
        health:
          type: object
          required: [status]
          additionalProperties: false
          properties:
            status: {enum: [up, cooldown, down, blocked_known, disabled, unknown]}
            cooldown_until: {$ref: './esquemas/common.schema.json#/$defs/Timestamp'}
            consecutive_failures: {type: integer, minimum: 0}
            last_outcomes:
              type: array
              maxItems: 20
              items:
                type: object
                required: [at, outcome]
                additionalProperties: false
                properties:
                  at: {$ref: './esquemas/common.schema.json#/$defs/Timestamp'}
                  outcome: {type: string}
                  elapsed_s: {type: number, minimum: 0}
    AssetDiff:
      type: object
      required: [asset_id, from, to, mode, changes]
      additionalProperties: false
      properties:
        asset_id: {$ref: './esquemas/common.schema.json#/$defs/AssetId'}
        from: {$ref: './esquemas/common.schema.json#/$defs/Sha256'}
        to: {$ref: './esquemas/common.schema.json#/$defs/Sha256'}
        mode: {enum: [segments, json_pointer, text]}
        changes:
          type: array
          items:
            type: object
            required: [op, path]
            additionalProperties: false
            properties:
              op: {enum: [add, remove, replace]}
              path: {type: string}
              before: {}
              after: {}
    AuditVerification:
      type: object
      required: [ok, checked, first_bad_seq, head_seq, head_hash]
      additionalProperties: false
      properties:
        ok: {type: boolean}
        checked: {type: integer, minimum: 0}
        first_bad_seq: {type: ['integer', 'null'], minimum: 1}
        head_seq: {type: integer, minimum: 0}
        head_hash: {$ref: './esquemas/common.schema.json#/$defs/Sha256'}
    LoginInput:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'}
        password: {type: string, minLength: 12, maxLength: 256}
        totp: {type: string, pattern: '^[0-9]{6}$'}
    UserInput:
      type: object
      required: [id, display_name, roles]
      additionalProperties: false
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'}
        display_name: {type: string, maxLength: 80}
        roles: {type: array, minItems: 1, uniqueItems: true, items: {$ref: './esquemas/common.schema.json#/$defs/Role'}}
    UserPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        roles: {type: array, minItems: 1, uniqueItems: true, items: {$ref: './esquemas/common.schema.json#/$defs/Role'}}
        disabled: {type: boolean}
    UserList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/User'}}
    VectorIndexList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/VectorIndexStatus'}}
    AlertPage:
      type: object
      required: [items, page]
      additionalProperties: false
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Alert'}}
        page: {$ref: './esquemas/common.schema.json#/$defs/PageInfo'}
    RunPage:
      type: object
      required: [items, page]
      additionalProperties: false
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RunRecord'}}
        page: {$ref: './esquemas/common.schema.json#/$defs/PageInfo'}
    JobPage:
      type: object
      required: [items, page]
      additionalProperties: false
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Job'}}
        page: {$ref: './esquemas/common.schema.json#/$defs/PageInfo'}
    EvaluationPage:
      type: object
      required: [items, page]
      additionalProperties: false
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/EvaluationResult'}}
        page: {$ref: './esquemas/common.schema.json#/$defs/PageInfo'}
    FeedbackPage:
      type: object
      required: [items, page]
      additionalProperties: false
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Feedback'}}
        page: {$ref: './esquemas/common.schema.json#/$defs/PageInfo'}
    InterventionPage:
      type: object
      required: [items, page]
      additionalProperties: false
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Intervention'}}
        page: {$ref: './esquemas/common.schema.json#/$defs/PageInfo'}
    ConfigVersionPage:
      type: object
      required: [items, page]
      additionalProperties: false
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ConfigVersion'}}
        page: {$ref: './esquemas/common.schema.json#/$defs/PageInfo'}
    ConfigChangePage:
      type: object
      required: [items, page]
      additionalProperties: false
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ConfigChange'}}
        page: {$ref: './esquemas/common.schema.json#/$defs/PageInfo'}
    AssetPage:
      type: object
      required: [items, page]
      additionalProperties: false
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Asset'}}
        page: {$ref: './esquemas/common.schema.json#/$defs/PageInfo'}
    AuditPage:
      type: object
      required: [items, page]
      additionalProperties: false
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
        page: {$ref: './esquemas/common.schema.json#/$defs/PageInfo'}
