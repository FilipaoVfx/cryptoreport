# Perfil operativo: cinco canales, ventana móvil de 48 h, sin transcripción de pago.
# Instalar en /etc/systemd/system/cryptoreport-transcripts.service.d/no-paid.conf
[Service]
Environment=CR_LOOKBACK_HOURS=48
Environment=CR_PROVIDERS=scrapertech,ytdlp,supadata
Environment=CR_SUPADATA_GENERATE=false
# Respaldo nativo limitado; nunca activar generación pagada de audio por defecto.
Environment=CR_SUPADATA_MONTHLY_CREDITS=20
# Regenera los datos móviles desde transcripciones y análisis ya guardados; no usa modelos.
ExecStartPost=/root/cryptoreport/services/transcripts/.venv/bin/python /root/cryptoreport/prototypes/movil/build_data.py
# Arranca el puente después de liberar el cerrojo de extracción; el timer propio
# es respaldo si no hay nuevos ciclos de extracción.
ExecStartPost=/usr/bin/systemctl --no-block start cryptoreport-bridge.service
