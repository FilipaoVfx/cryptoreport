# Sitio del pipeline de transcripciones. Instalar con: sudo ops/install-site.sh
# Estático: index.html + site.css + data.json (lo regenera el servicio en cada ciclo) en /var/www/cryptoreport.
# /transcripts/ se sirve directo desde el directorio de datos del servicio: siempre lo último guardado.
limit_req_zone $binary_remote_addr zone=cryptoreport:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name cryptoreport.2-25-233-186.sslip.io;

    root /var/www/cryptoreport;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json text/markdown;

    auth_basic "Crypto Report";
    auth_basic_user_file /etc/nginx/cryptoreport.htpasswd;

    limit_req zone=cryptoreport burst=40 nodelay;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # Sin add_header en las location para no perder las cabeceras de arriba; `expires -1` = Cache-Control: no-cache.
    location = /data.json {
        expires -1;
    }

    location /transcripts/ {
        alias /var/lib/cryptoreport-transcripts/transcripts/;
        autoindex on;
        expires -1;
        types { application/json json; text/markdown md; }
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
