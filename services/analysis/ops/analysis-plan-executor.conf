# Relevo del 2026-11-03: solo Codex con la suscripción ChatGPT.
# Instalar en /etc/systemd/system/cryptoreport-analysis-plan.service.d/executor.conf
[Unit]
Description=CryptoReport: análisis narrativo autónomo con Codex y la suscripción ChatGPT

[Service]
Environment=CR_ANALYSIS_EXECUTOR=codex
MemoryMax=1500M
# Dos trabajos con dos intentos de 15 minutos, más margen operativo.
TimeoutStartSec=65min
