<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafaf7">
<meta name="robots" content="noindex">
<title>Titular · CryptoReport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body data-screen="home">
<a class="skip" href="#page">Saltar al contenido</a>

<header class="nh" id="nh">
  <a class="nh-brand" href="#/">CryptoReport</a>
  <a class="nh-btn" href="#/buscar" aria-label="Buscar en todo el archivo"><svg class="i"><use href="#i-search"></use></svg></a>
  <a class="nh-btn" href="#/datos" aria-label="Cómo leer esto"><svg class="i"><use href="#i-help"></use></svg></a>
</header>

<header class="topbar" id="topbar">
  <button class="ib" type="button" data-act="back" aria-label="Volver"><svg class="i"><use href="#i-arrow-left"></use></svg></button>
  <p class="topbar-title" id="topbar-title"></p>
  <button class="ib" type="button" data-act="share-video" aria-label="Compartir con el minuto actual"><svg class="i"><use href="#i-share"></use></svg></button>
</header>

<div class="stage" id="stage" data-mode="none">
  <div class="stage-player" id="player"></div>
  <div class="pip-bar">
    <button class="pip-btn" type="button" data-act="pip-toggle" id="pip-toggle" aria-label="Reproducir"><svg class="i"><use href="#i-play"></use></svg></button>
    <button class="pip-btn" type="button" data-act="snap" data-snap="half" aria-label="Volver al vídeo grande"><svg class="i"><use href="#i-expand"></use></svg></button>
    <button class="pip-btn pip-close" type="button" data-act="pip-close" aria-label="Cerrar el vídeo flotante"><svg class="i"><use href="#i-close"></use></svg></button>
  </div>
</div>

<main id="page" tabindex="-1"></main>

<section class="nb" id="nb" data-snap="half" aria-label="Cuaderno del vídeo" hidden>
  <div class="nb-handle" id="nb-handle">
    <button class="nb-grip" type="button" data-act="cycle" id="nb-grip" aria-label="Cuaderno a media altura. Pulsa para ampliarlo."><span></span></button>
    <div class="now" id="now"></div>
    <button class="nb-pulse" type="button" id="nb-pulse" data-act="pulse" aria-label="Tono a lo largo del vídeo: toca para saltar a ese momento"></button>
    <div class="lenses" role="radiogroup" aria-label="Lente del cuaderno" id="lenses"></div>
  </div>
  <div class="nb-body" id="nb-body"></div>
</section>

<nav class="dock" id="dock" aria-label="Secciones">
  <a href="#/" data-d="home"><svg class="i"><use href="#i-calendar"></use></svg><span>Bitácora</span></a>
  <a href="#/activos" data-d="activos"><svg class="i"><use href="#i-list"></use></svg><span>Activos</span></a>
  <a href="#/guardados" data-d="guardados"><svg class="i"><use href="#i-bookmark"></use></svg><span>Guardados</span></a>
</nav>

<div class="scrim" id="scrim" hidden></div>
<section class="ficha" id="ficha" role="dialog" aria-modal="true" aria-labelledby="ficha-title" hidden>
  <div class="ficha-head"><h2 id="ficha-title">Activo</h2><button class="ib" type="button" data-act="ficha-close" aria-label="Cerrar la ficha"><svg class="i"><use href="#i-close"></use></svg></button></div>
  <div class="ficha-body" id="ficha-body"></div>
</section>

<script src="../shared/core.js"></script>
<script src="../shared/player.js"></script>
<script src="app.js"></script>
</body>
</html>
