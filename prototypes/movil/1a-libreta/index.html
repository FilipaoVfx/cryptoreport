<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Libreta · CryptoReport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body data-screen="home">
<a class="skip" href="#view">Saltar al contenido</a>

<header class="appbar" id="appbar">
  <a class="brand" href="#/" aria-label="CryptoReport, inicio">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="14" height="18" rx="2.5"/><path d="M8 3v18M11 8h4M11 11.5h4"/></svg>
    <span>CryptoReport</span>
  </a>
  <div class="appbar-actions">
    <a class="proto" href="../index.html" title="Volver al tablero de propuestas">1A · Libreta</a>
    <a class="icon-btn" href="#/buscar" aria-label="Buscar"><svg class="i"><use href="#i-search"></use></svg></a>
  </div>
</header>

<header class="videobar" id="videobar">
  <button class="icon-btn" type="button" data-act="back" aria-label="Volver"><svg class="i"><use href="#i-arrow-left"></use></svg></button>
  <p class="videobar-title" id="videobar-title"></p>
  <button class="icon-btn" type="button" data-act="save-video" id="vb-save" aria-label="Guardar vídeo"><svg class="i"><use href="#i-bookmark"></use></svg></button>
  <button class="icon-btn" type="button" data-act="share-video" aria-label="Compartir vídeo"><svg class="i"><use href="#i-share"></use></svg></button>
</header>

<div class="dock" id="dock" data-mode="none">
  <div class="dock-player" id="player"></div>
  <a class="dock-meta" id="dock-meta" href="#/">
    <span class="dock-title" id="dock-title"></span>
    <span class="dock-time" id="dock-time"></span>
  </a>
  <button class="icon-btn dock-btn" type="button" data-act="dock-toggle" id="dock-toggle" aria-label="Reproducir"><svg class="i"><use href="#i-play"></use></svg></button>
  <button class="icon-btn dock-btn" type="button" data-act="dock-close" aria-label="Cerrar reproductor"><svg class="i"><use href="#i-close"></use></svg></button>
  <div class="dock-progress" aria-hidden="true"><span id="dock-bar"></span></div>
</div>

<main id="view" tabindex="-1"></main>

<nav class="tabbar" id="tabbar" aria-label="Secciones">
  <a href="#/" data-tab="home"><svg class="i"><use href="#i-film"></use></svg><span>Vídeos</span></a>
  <a href="#/narrativas" data-tab="narrativas"><svg class="i"><use href="#i-route"></use></svg><span>Narrativas</span></a>
  <a href="#/activos" data-tab="activos"><svg class="i"><use href="#i-coin"></use></svg><span>Activos</span></a>
  <a href="#/guardados" data-tab="guardados"><svg class="i"><use href="#i-bookmark"></use></svg><span>Guardados</span></a>
</nav>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head">
    <h2 class="sheet-title" id="sheet-title"></h2>
    <button class="icon-btn" type="button" data-act="sheet-close" aria-label="Cerrar"><svg class="i"><use href="#i-close"></use></svg></button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
  <div class="sheet-foot" id="sheet-foot"></div>
</section>

<script src="../shared/core.js"></script>
<script src="../shared/player.js"></script>
<script src="app.js"></script>
</body>
</html>
