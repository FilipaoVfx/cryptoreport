name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.14']
    env:
      CRA_ALLOW_API_ANALYSIS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r services/analysis/requirements.txt
      - run: python -m unittest discover -s tests -t .
        working-directory: services/analysis
      - run: python -m unittest discover -s tests -t .
        working-directory: services/transcripts
      - run: PYTHONPATH=../analysis:../transcripts python -m unittest discover -s tests -t .
        working-directory: services/bridge
