name: Vercel y PWA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pwa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          CAPTURE_DIR: test-results/pwa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pwa-evidence
          path: test-results/pwa
