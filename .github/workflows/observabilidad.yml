name: Contratos de observabilidad
on:
  push:
    paths:
      - 'docs/observabilidad/**'
      - 'docs/automatizacion-drive/**'
      - 'services/**'
      - 'prototypes/movil/tono.py'
      - 'prototypes/movil/shared/core.js'
      - 'prototypes/movil/build_data.py'
      - '.github/workflows/observabilidad.yml'
  pull_request:
    paths:
      - 'docs/observabilidad/**'
      - 'docs/automatizacion-drive/**'
      - 'services/**'
      - 'prototypes/movil/tono.py'
      - 'prototypes/movil/shared/core.js'
      - 'prototypes/movil/build_data.py'
      - '.github/workflows/observabilidad.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: observabilidad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contratos:
    # PV-01…06, PV-10, PV-11, PV-15, PV-16 y PV-17: sin red, sin servicios y sin claves.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r docs/observabilidad/herramientas/requirements.txt
      - run: python docs/observabilidad/herramientas/validate_contracts.py
      - run: python -m unittest discover -s docs/observabilidad/herramientas/tests -t docs/observabilidad/herramientas
